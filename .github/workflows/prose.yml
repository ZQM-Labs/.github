name: Prose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  markdownlint:
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'

  links:
    runs-on: [self-hosted, Linux, X64, zqm-linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --accept 200,503 --exclude 'github\.com/ZQM-Labs/quest-analytics' '**/*.md'
