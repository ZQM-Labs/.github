name: Supply Chain Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan dependencies and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      report_available: ${{ steps.locate.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test vendored scanner parsing
        if: ${{ hashFiles('.github/scripts/tests/**') != '' }}
        env:
          PYTHONPATH: .github/scripts
        run: python -m unittest discover -s .github/scripts/tests -v

      - name: Install vulnerability scanners
        run: python -m pip install --disable-pip-version-check --upgrade "pip-audit>=2.10" "safety<3" "cyclonedx-python-lib<8" "setuptools<81" wheel  # floors keep the resolver off the broken combo (safety 2.3.5 caps packaging<22 -> pip-audit 2.4.12 -> cyclonedx.parser gone); --upgrade + setuptools/wheel because safety scans this environment itself and the gate fails on any finding - the tool env's bundled bootstrap packages must be current (setuptools<81: safety 2.3.x needs pkg_resources, removed in setuptools 81)

      - name: Run supply-chain scanner
        id: scan
        shell: bash
        run: |
          python .github/scripts/zqm_supply_chain_scanner.py \
            --repo "${{ github.repository }}" \
            --output both \
            --no-comment

      - name: Locate SARIF report
        id: locate
        if: always()
        shell: bash
        run: |
          report="$(find .zqm-security-reports -type f -name '*-results.sarif' -print -quit 2>/dev/null || true)"
          if [[ -n "$report" ]]; then
            echo "path=$report" >> "$GITHUB_OUTPUT"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Scanner did not produce a SARIF report; inspect the scanner step output."
          fi

      - name: Upload scan report artifact
        if: always() && steps.locate.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: supply-chain-scan-${{ github.run_id }}
          path: .zqm-security-reports/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  upload-sarif:
    name: Publish SARIF to code security
    if: always() && github.event_name != 'pull_request' && needs.scan.outputs.report_available == 'true'
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download scan report artifact
        uses: actions/download-artifact@v8
        with:
          name: supply-chain-scan-${{ github.run_id }}
          path: reports

      - name: Locate downloaded SARIF report
        id: locate
        shell: bash
        run: |
          report="$(find reports -type f -name '*-results.sarif' -print -quit)"
          if [[ -z "$report" ]]; then
            echo "::error::Expected SARIF report was not present in the downloaded artifact."
            exit 1
          fi
          echo "path=$report" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF
        # GitHub Advanced Security is not enabled for this private repo
        # (owner/billing), so the code-scanning API rejects the upload.
        # The scan job above is the real gate; keep the SARIF as a run
        # artifact and do not fail the workflow on the publish sink
        # (same treatment as quest-analytics).
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.locate.outputs.path }}
